# mise global config
# =============================================================================
# Applies wherever no closer config or version file sets a tool.

[tools]
  # A release line, not a fixed version, so `mise upgrade` picks up patches.
  # Repos that need a specific version pin it in their own .nvmrc.
  node = "lts"
  # Node 25+ no longer ships corepack, so mise provides pnpm instead.
  pnpm = "latest"
  # The only .NET on PATH. Global .NET tools install and run on it, and repos
  # that pin an SDK in global.json get theirs installed beside it.
  dotnet = "latest"

[settings]
  # Honor .nvmrc / .node-version so each repo runs the Node its CI uses,
  # package.json's packageManager so it runs the pnpm or yarn it pins, and
  # global.json so it runs the .NET SDK it pins.
  idiomatic_version_file_enable_tools = [ "dotnet", "node", "pnpm", "yarn" ]
