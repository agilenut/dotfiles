name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger for feature branches

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # Pull requests only. A squash merge copies trailers out of the branch commits
  # onto main, and a commit message cannot be edited once it is there - so this
  # has to fail while a rebase is still the fix. Failing on push to main would
  # report something nobody can act on without rewriting history.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Same rule as the `no-attribution-trailers` pre-commit hook, which only
      # runs for whoever installed it.
      - name: no attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # From the merge base, not the base tip: if the base branch moves
          # backwards the range would otherwise pick up commits already on main,
          # which no rebase can fix. Collected before grepping, so a range git
          # cannot resolve fails the job rather than passing it on an empty pipe.
          base=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          messages=$(git log --format='%B' "${base}..${HEAD_SHA}")
          if grep -inE '^[[:space:]]*(co-authored-by:.*(claude|anthropic)|claude-session:)|^[^[:alnum:]]*generated with \[?claude|claude\.ai/code/session' <<<"${messages}"; then
            echo "::error::A commit message carries an attribution trailer. Rebase to remove it - once it reaches main only a history rewrite can."
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest] # Add ubuntu-latest when ready
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)"

      # Best effort. The runner image bundles Homebrew metadata from its weekly
      # build, and refreshing it avoids installing against stale formulae. It
      # also reaches every tap the image ships, including ones these dotfiles
      # never use, so a single unreachable tap must not fail the job: a run has
      # already been lost to a 75s connect timeout on aws/homebrew-tap. On
      # failure the bundled metadata is used instead.
      - name: Refresh Homebrew metadata
        run: brew update || echo "brew update failed; continuing with bundled metadata"

      # The cask list is emptied rather than skipped in the install script: the
      # template already guards on it being non-empty, so this needs no branch
      # in the install logic, and chezmoi deep-merges the override so the rest
      # of the profile (git identity, dev tools) survives.
      #
      # A GUI app cannot be exercised on a headless runner, and a publisher
      # changing a download out from under homebrew-cask's recorded checksum
      # fails `Apply dotfiles` - which skips `Run tests` entirely and reports a
      # red "test" check for a suite that never executed. warp did exactly that.
      - name: Apply dotfiles
        run: |
          ./bin/chezmoi init --apply --source=${{ github.workspace }} \
            --override-data '{"profile":"personal","profiles":{"personal":{"apps":{"casks":[]}}}}'

      - name: Run tests
        shell: zsh -i {0}
        run: ~/.local/bin/dotfiles-test --auto-only
