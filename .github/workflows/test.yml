name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger for feature branches

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest] # Add ubuntu-latest when ready
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)"

      # Best effort. The runner image bundles Homebrew metadata from its weekly
      # build, and refreshing it avoids installing against stale formulae. It
      # also reaches every tap the image ships, including ones these dotfiles
      # never use, so a single unreachable tap must not fail the job: a run has
      # already been lost to a 75s connect timeout on aws/homebrew-tap. On
      # failure the bundled metadata is used instead.
      - name: Refresh Homebrew metadata
        run: brew update || echo "brew update failed; continuing with bundled metadata"

      - name: Apply dotfiles
        run: |
          ./bin/chezmoi init --apply --source=${{ github.workspace }} \
            --override-data '{"profile":"personal"}'

      - name: Run tests
        shell: zsh -i {0}
        run: ~/.local/bin/dotfiles-test --auto-only
